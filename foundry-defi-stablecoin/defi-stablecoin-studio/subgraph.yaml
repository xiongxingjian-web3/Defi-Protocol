specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: DSCEngine
    network: sepolia
    source:
      address: "0x547d5dB6627fA66560AA7f6b49881fe095633Ca0"
      abi: DSCEngine
      startBlock: 10835706
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CollateralDeposited
        - CollateralRedeemed
        - DscBurned
        - DscMinted
        - Liquidated
      abis:
        - name: DSCEngine
          file: ./abis/DSCEngine.json
      eventHandlers:
        - event: CollateralDeposited(indexed address,indexed address,uint256)
          handler: handleCollateralDeposited
        - event: CollateralRedeemed(indexed address,indexed address,uint256)
          handler: handleCollateralRedeemed
        - event: DscBurned(indexed address,uint256)
          handler: handleDscBurned
        - event: DscMinted(indexed address,uint256)
          handler: handleDscMinted
        - event: Liquidated(indexed address,indexed address,uint256)
          handler: handleLiquidated
      file: ./src/dsc-engine.ts
